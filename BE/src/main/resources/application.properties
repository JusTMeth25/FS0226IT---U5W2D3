spring.application.name=document-archive

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/U5W1D3
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload (per documenti da OCR)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# OCR - path dati Tesseract (tessdata)
ocr.tessdata-path=./tessdata

# Storage filesystem
storage.upload-dir=./uploads

# CORS - origini frontend (comma-separated)
cors.allowed-origins=http://localhost:5173,http://localhost:3000
